<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArteDelCantar | Pro Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d4af37;
            --bg: #0a0a0a;
            --card-bg: #141414;
            --text: #ffffff;
            --text-muted: #888888;
            --success: #2ecc71;
            --warning: #f1c40f;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

        /* Layout */
        header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--glass); display: flex; justify-content: space-between; align-items: center; background: rgba(10,10,10,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--primary); }
        main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        /* Metrics */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .metric-card { background: var(--card-bg); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--glass); }
        .metric-val { font-size: 2rem; font-weight: 600; color: var(--primary); display: block; }
        .metric-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* Navigation */
        .nav-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--glass); padding-bottom: 1rem; }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-family: inherit; font-size: 1rem; cursor: pointer; padding: 0.5rem 1rem; border-radius: 8px; transition: 0.3s; }
        .nav-btn.active { color: var(--primary); background: var(--glass); }

        /* CRM Table */
        .section { display: none; }
        .section.active { display: block; }
        .card { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--glass); overflow: hidden; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 1.2rem; text-align: left; border-bottom: 1px solid var(--glass); }
        th { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        
        /* Badges */
        .badge { padding: 0.3rem 0.8rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .status-pendiente { background: #f1c40f22; color: #f1c40f; }
        .status-contactado { background: #3498db22; color: #3498db; }
        .status-asignado { background: #2ecc7122; color: #2ecc71; }
        .commitment-pro { border: 1px solid var(--primary); color: var(--primary); }

        /* Buttons */
        .btn { padding: 0.8rem 1.5rem; border-radius: 10px; border: none; font-family: inherit; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-wa { background: #25d366; color: #fff; text-decoration: none; font-size: 0.8rem; }
        .btn-icon { padding: 0.5rem; background: var(--glass); color: var(--text); border-radius: 8px; }

        /* Forms */
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        input, select, textarea { width: 100%; padding: 0.8rem; background: #1a1a1a; border: 1px solid var(--glass); border-radius: 10px; color: #fff; font-family: inherit; }

        /* Overlays */
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 500; }

        @media (max-width: 768px) {
            main { padding: 1rem; }
            .metrics-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div id="loading"><div>Cargando...</div></div>

    <!-- Login -->
    <div id="loginOverlay">
        <div style="max-width: 320px; width: 100%; text-align: center;">
            <div class="logo" style="font-size: 2.5rem; margin-bottom: 2rem;">Arte del Cantar</div>
            <input type="password" id="adminPass" placeholder="Contraseña Admin" style="margin-bottom: 1rem; text-align: center;">
            <button onclick="login()" class="btn btn-primary" style="width: 100%; justify-content: center;">Entrar al Dashboard</button>
            <p style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted);">Por defecto: admin123</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <header>
        <div class="logo">Arte del Cantar</div>
        <button onclick="logout()" class="btn btn-icon">Cerrar Sesión</button>
    </header>

    <main>
        <!-- Metrics Bar -->
        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-val" id="stat-total">-</span>
                <span class="metric-label">Alumnos Totales</span>
            </div>
            <div class="metric-card">
                <span class="metric-val" id="stat-pending">-</span>
                <span class="metric-label">Pendientes</span>
            </div>
            <div class="metric-card">
                <span class="metric-val" id="stat-free">-</span>
                <span class="metric-label">Cupos Libres</span>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('pipeline')">Pipeline (CRM)</button>
            <button class="nav-btn" onclick="switchTab('agenda')">Agenda (Clases)</button>
        </div>

        <!-- Section: Pipeline / CRM -->
        <section id="pipelineTab" class="section active">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; align-items: center;">
                <h2>Pipeline de Alumnos</h2>
                <button class="btn btn-outline" onclick="openImportModal()">📥 Importar desde WhatsApp</button>
            </div>
            <div class="card">
                <div class="table-container">
                    <table id="studentsTable">
                        <thead>
                            <tr>
                                <th>Alumno</th>
                                <th>Nivel / Compromiso</th>
                                <th>Estado</th>
                                <th>Contacto</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="studentsBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Section: Agenda -->
        <section id="agendaTab" class="section">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; align-items: center;">
                <h2>Horarios de Clase</h2>
                <button class="btn btn-primary" onclick="openNewSession()">+ Nuevo Horario</button>
            </div>
            <div class="card">
                <div class="table-container">
                    <table id="sessionsTable">
                        <thead>
                            <tr>
                                <th>Día</th>
                                <th>Hora</th>
                                <th>Cupo</th>
                                <th>Modalidad</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="sessionsBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyqq8TbwiwRjkwEazwXbT5pVKTj8PXyWMAq1Pm8-UiyTg_m_crBG2fzM4mV_9OPKAPHVA/exec';
        let AUTH_TOKEN = localStorage.getItem('ARTEDELCANTAR_TOKEN');

        window.onload = () => {
            if (AUTH_TOKEN) {
                document.getElementById('loginOverlay').style.display = 'none';
                refreshDashboard();
            }
        };

        async function api(action, payload = {}) {
            document.getElementById('loading').style.display = 'flex';
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, payload, token: AUTH_TOKEN })
                });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error);
                return data;
            } catch (e) {
                if (e.message.includes('autorizado')) logout();
                alert("Error: " + e.message);
                throw e;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function login() {
            const password = document.getElementById('adminPass').value;
            const res = await api('login', { password });
            AUTH_TOKEN = res.data.token;
            localStorage.setItem('ARTEDELCANTAR_TOKEN', AUTH_TOKEN);
            document.getElementById('loginOverlay').style.display = 'none';
            refreshDashboard();
        }

        function logout() {
            localStorage.removeItem('ARTEDELCANTAR_TOKEN');
            location.reload();
        }

        function switchTab(tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
            if (tab === 'pipeline') loadStudents();
            if (tab === 'agenda') loadSessions();
        }

        async function refreshDashboard() {
            const res = await api('getDashboardStats');
            const s = res.data;
            document.getElementById('stat-total').innerText = s.total;
            document.getElementById('stat-pending').innerText = s.pending;
            document.getElementById('stat-free').innerText = s.free_slots;
            loadStudents();
        }

        async function loadStudents() {
            const res = await api('getStudents');
            const body = document.getElementById('studentsBody');
            body.innerHTML = res.data.map(s => `
                <tr>
                    <td>
                        <div style="font-weight:600">${s.full_name}</div>
                        <div style="font-size:0.75rem; color:var(--text-muted)">${s.age} años | ${s.goal.substring(0,25)}...</div>
                    </td>
                    <td>
                        <div style="font-size:0.8rem">${s.vocal_level}</div>
                        <span class="badge commitment-pro" style="font-size:0.6rem">${s.commitment}</span>
                    </td>
                    <td><span class="badge status-${s.status}">${s.status}</span></td>
                    <td>
                        <a href="https://wa.me/${s.whatsapp}" target="_blank" class="btn btn-wa">WhatsApp</a>
                    </td>
                    <td>
                        <select onchange="updateStatus('${s.id}', this.value)" style="width:auto; padding:0.2rem">
                            <option value="">Cambiar...</option>
                            <option value="contactado">Contactado</option>
                            <option value="activo">Activo</option>
                            <option value="abandonó">Abandonó</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        async function updateStatus(id, status) {
            if (!status) return;
            await api('updateStudent', { id, updates: { status } });
            refreshDashboard();
        }

        async function loadSessions() {
            const res = await api('getSessions');
            const body = document.getElementById('sessionsBody');
            body.innerHTML = res.data.map(s => `
                <tr>
                    <td>${s.day}</td>
                    <td>${s.start_time} - ${s.end_time}</td>
                    <td>
                        <div style="font-weight:600">${s.current_students}/${s.max_students}</div>
                        <div style="width:100%; height:4px; background:var(--glass); border-radius:2px; margin-top:4px">
                            <div style="width:${(s.current_students/s.max_students)*100}%; height:100%; background:var(--primary); border-radius:2px"></div>
                        </div>
                    </td>
                    <td>${s.mode}</td>
                    <td>
                        <button class="btn btn-icon" onclick="deleteSession('${s.id}')">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        async function openNewSession() {
            const day = prompt("Día (Lunes, Martes...)");
            const start = prompt("Hora inicio (Ej: 16:00)");
            const end = prompt("Hora fin (Ej: 17:00)");
            if (day && start && end) {
                await api('createSession', { day, start_time: start, end_time: end, max_students: 5 });
                loadSessions();
            }
        }

        async function deleteSession(id) {
            if (confirm("¿Eliminar este horario?")) {
                await api('deleteSession', { id });
                loadSessions();
            }
        }

        async function openImportModal() {
            const raw = prompt("Pega los números de WhatsApp separados por comas o saltos de línea:");
            if (!raw) return;
            const numbers = raw.split(/[\n,]/).map(n => n.trim()).filter(n => n);
            const res = await api('bulkImport', { numbers });
            alert(`Se importaron ${res.data.imported} alumnos nuevos.`);
            loadStudents();
        }
    </script>
</body>
</html>
