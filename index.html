<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arte del Cantar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* (Mantén tus estilos actuales, solo agrego lo necesario para el modal) */
        :root {
            --primary: #2a9d8f; 
            --bg: #0a0a0a;
            --card-bg: #141414;
            --text: #ffffff;
            --text-muted: #888888;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
        header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--glass); display: flex; justify-content: center; background: rgba(10,10,10,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 1200px; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo-container { cursor: pointer; user-select: none; display: flex; align-items: center; }
        .logo-img { height: 50px; width: 50px; border-radius: 50%; background: #fff; padding: 2px; object-fit: contain; }
        .lang-switch { display: inline-flex; gap: 0.35rem; align-items: center; }
        .lang-pill { padding: 0.35rem 0.7rem; border-radius: 999px; border: 1px solid var(--glass); background: rgba(255,255,255,0.04); color: var(--text-muted); cursor: pointer; font-size: 0.85rem; }
        .lang-pill.active { color: var(--text); border-color: var(--primary); background: rgba(42, 157, 143, 0.15); }
        main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hero { text-align: center; margin-bottom: 3rem; }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 1rem; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: var(--card-bg); padding: 2rem; border-radius: 20px; border: 1px solid var(--glass); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        input, select, textarea { width: 100%; padding: 1rem; background: #1a1a1a; border: 1px solid var(--glass); border-radius: 10px; color: #fff; font-family: inherit; transition: var(--transition); }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; background: #1a1a1a; padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--glass); cursor: pointer; }
        .btn { padding: 1rem 2rem; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary { background: var(--primary); color: #000; width: 100%; }
        .btn-outline { background: transparent; border: 1px solid var(--glass); color: var(--text); }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .metric-card { background: var(--card-bg); padding: 1.5rem; border-radius: 16px; text-align: center; }
        .metric-val { font-size: 2rem; font-weight: 600; color: var(--primary); display: block; }
        .nav-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--glass); padding-bottom: 1rem; }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-family: inherit; font-size: 1rem; cursor: pointer; padding: 0.5rem 1rem; border-radius: 8px; }
        .nav-btn.active { color: var(--primary); background: var(--glass); }
        .dash-view { display: none; }
        .dash-view.active { display: block; }
        .badge { padding: 0.3rem 0.8rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
        .students-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .student-card { background: var(--card-bg); border: 1px solid var(--glass); border-radius: 16px; padding: 1.5rem; }
        .student-actions { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
        .student-action-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .whatsapp-toggle { background: rgba(37, 211, 102, 0.15); color: #25D366; }
        .whatsapp-menu { display: none; flex-direction: column; gap: 0.45rem; }
        .whatsapp-menu.open { display: flex; }
        .whatsapp-menu .btn-action { width: 100%; }
        .notifications-list { display: grid; gap: 0.75rem; }
        .notification-item { background: var(--card-bg); border: 1px solid var(--glass); border-radius: 12px; padding: 1rem; }
        .notification-item.unread { border-color: var(--primary); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(200px, 1fr)); gap: 1rem; overflow-x: auto; }
        .calendar-day { background: var(--card-bg); border-radius: 12px; padding: 1rem; min-height: 300px; }
        .session-card { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; border-left: 3px solid var(--primary); }
        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: var(--card-bg); border-radius: 20px; padding: 2rem; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .calendar-grid { grid-template-columns: repeat(7, minmax(280px, 1fr)); } }
    </style>
</head>
<body>
<div id="loading">Procesando...</div>

<header>
    <div class="header-content">
        <div class="logo-container" ondblclick="handleLogoDoubleClick()">
            <img src="logo.jpg" alt="Logo" class="logo-img">
            <span style="font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--primary);">Arte del Cantar</span>
        </div>
        <div style="display:flex; align-items:center; gap:0.75rem;">
            <div class="lang-switch" aria-label="Language switch">
                <button type="button" class="lang-pill active" id="lang-es" onclick="setLanguage('es')">ES</button>
                <button type="button" class="lang-pill" id="lang-en" onclick="setLanguage('en')">EN</button>
            </div>
            <button id="logoutBtn" onclick="logoutAdmin()" class="btn-outline" style="display:none; padding:0.5rem 1rem;">Cerrar sesión</button>
        </div>
    </div>
</header>

<main>
    <!-- Sección pública -->
    <section id="publicSection" class="section active">
        <div class="hero">
            <h1 data-i18n="heroTitle">Agenda tu clase de canto</h1>
            <p data-i18n="heroSubtitle">Déjanos tu disponibilidad y la maestra te contactará para confirmar tu horario.</p>
        </div>
        <div class="card">
            <form id="studentForm" onsubmit="submitStudentForm(event)">
                <div class="grid">
                    <div class="form-group"><label>Nombre completo</label><input type="text" name="full_name" required></div>
                    <div class="form-group"><label>WhatsApp</label><input type="tel" name="whatsapp" required placeholder="+52..."></div>
                    <div class="form-group"><label>Edad</label><input type="number" name="age"></div>
                    <div class="form-group"><label>Nivel vocal</label><select name="vocal_level" required><option value="">Selecciona...</option><option>Principiante</option><option>Intermedio</option><option>Avanzado</option></select></div>
                </div>
                <div class="form-group"><label>Objetivo</label><textarea name="goal" rows="2" required></textarea></div>
                <div class="form-group"><label>Compromiso</label><select name="commitment" required><option value="">Selecciona...</option><option>Solo quiero probar</option><option>Quiero mejorar</option><option>Disciplina real</option></select></div>
                <div class="grid">
                    <div class="form-group"><label>Días disponibles</label><div class="checkbox-group" id="daysGroup"></div></div>
                    <div class="form-group"><label>Horarios</label><div class="checkbox-group" id="timesGroup"></div></div>
                </div>
                <div class="grid">
                    <div class="form-group"><label>Clases por semana</label><input type="number" name="classes_per_week" value="1" min="1" max="5"></div>
                    <div class="form-group"><label>Comentarios</label><input type="text" name="comments"></div>
                </div>
                <button type="submit" class="btn btn-primary" data-i18n="publicSubmit">Enviar disponibilidad</button>
            </form>
        </div>
    </section>

    <!-- Login -->
    <section id="loginSection" class="section">
        <div class="card" style="max-width:400px; margin:4rem auto;">
            <h2 style="margin-bottom:1rem;" data-i18n="loginTitle">Acceso profesor</h2>
            <form onsubmit="loginAdmin(event)">
                <div class="form-group"><label data-i18n="loginLabel">Contraseña</label><input type="password" id="adminPass" required></div>
                <button type="submit" class="btn btn-primary" data-i18n="loginBtn">Entrar</button>
                <button type="button" class="btn-outline" style="margin-top:1rem; width:100%;" onclick="volverPublico()" data-i18n="backBtn">Volver</button>
            </form>
            <details style="margin-top:1.25rem; padding-top:1rem; border-top:1px solid var(--glass);">
                <summary style="cursor:pointer; font-size:0.95rem; color:var(--text); margin-bottom:0.75rem;" data-i18n="changePassTitle">Cambiar contraseña</summary>
                <form onsubmit="changePassword(event)">
                    <div class="form-group"><label data-i18n="currentPass">Contraseña actual</label><input type="password" id="currentPass" required></div>
                    <div class="form-group"><label data-i18n="newPass">Nueva contraseña</label><input type="password" id="newPass" required minlength="8"></div>
                    <button type="submit" class="btn btn-outline" style="width:100%;" data-i18n="updatePass">Actualizar contraseña</button>
                </form>
            </details>
            <details style="margin-top:1rem; padding-top:1rem; border-top:1px solid var(--glass);">
                <summary style="cursor:pointer; font-size:0.95rem; color:var(--text); margin-bottom:0.75rem;">Contactos de notificación</summary>
                <form onsubmit="saveTeacherContact(event)">
                    <div class="form-group">
                        <label>Email del profesor</label>
                        <input type="email" id="teacherEmail" placeholder="teacher@email.com">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp del profesor</label>
                        <input type="tel" id="teacherWhatsapp" placeholder="Con código de país">
                    </div>
                    <div class="form-group">
                        <label>Contraseña actual</label>
                        <input type="password" id="contactPass" required>
                    </div>
                    <button type="submit" class="btn btn-outline" style="width:100%;">Guardar contactos</button>
                </form>
            </details>
        </div>
    </section>

    <!-- Dashboard -->
    <section id="dashboardSection" class="section">
        <div class="metrics-grid" id="metrics"></div>
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchDashTab('dash-solicitudes')" data-i18n="tabRequests">Solicitudes</button>
            <button class="nav-btn" onclick="switchDashTab('dash-horarios')" data-i18n="tabSchedules">Horarios</button>
            <button class="nav-btn" onclick="switchDashTab('dash-asignaciones')" data-i18n="tabAssignments">Asignaciones</button>
            <button class="nav-btn" onclick="switchDashTab('dash-notificaciones')" data-i18n="tabNotifications">Notificaciones</button>
        </div>
        <div id="dash-solicitudes" class="dash-view active"><div class="students-grid" id="studentsGrid"></div></div>
        <div id="dash-horarios" class="dash-view"><div class="calendar-grid" id="calendarGrid"></div></div>
        <div id="dash-asignaciones" class="dash-view"><div class="calendar-grid" id="assignmentsGrid"></div></div>
        <div id="dash-notificaciones" class="dash-view"><div class="notifications-list" id="notificationsList"></div></div>
    </section>
</main>

<!-- Modal de selección de sesión -->
<div id="sessionModal" class="modal">
    <div class="modal-content">
        <h3>Seleccionar horario</h3>
        <div id="sessionList"></div>
        <button class="btn-outline" style="margin-top:1rem;" onclick="closeModal()">Cancelar</button>
    </div>
</div>

<script>
    // ================= CONFIGURACIÓN =================
    // IMPORTANTE: Reemplaza esta URL con la de tu Web App desplegada
    const API_URL = localStorage.getItem('ARTEDELCANTAR_API_URL') || 'https://script.google.com/macros/s/AKfycbyGrbJViblrhKIZ8Yjfbq0b1CkHzq24d_QLfWsKoFnD6YOO-5RnF-HKkjRxioFGtoDxjw/exec';
    let currentLang = localStorage.getItem('adcl_lang') || 'es';
    const DASHBOARD_CACHE_KEY = 'adcl_dashboard_cache_v1';
    const DASHBOARD_CACHE_TTL_MS = 3 * 60 * 1000;
    const I18N = {
        es: {
            heroTitle: 'Agenda tu clase de canto',
            heroSubtitle: 'Déjanos tu disponibilidad y la maestra te contactará para confirmar tu horario.',
            loginTitle: 'Acceso profesor',
            loginLabel: 'Contraseña',
            loginBtn: 'Entrar',
            backBtn: 'Volver',
            changePassTitle: 'Cambiar contraseña',
            currentPass: 'Contraseña actual',
            newPass: 'Nueva contraseña',
            updatePass: 'Actualizar contraseña',
            logout: 'Cerrar sesión',
            publicSubmit: 'Enviar disponibilidad',
            tabRequests: 'Solicitudes',
            tabSchedules: 'Horarios',
            tabAssignments: 'Asignaciones',
            tabNotifications: 'Notificaciones',
            metricsPending: 'Pendientes',
            metricsContacted: 'Contactados',
            metricsAssigned: 'Asignados',
            metricsActive: 'Activos',
            metricsFree: 'Cupos libres',
            notifEmpty: 'Sin notificaciones',
            notifUnread: 'Sin leer',
            notifRead: 'Leída',
            notifTitle: 'Notificaciones',
            notifSuccess: 'Nueva solicitud registrada',
            publicSuccess: 'Disponibilidad enviada'
        },
        en: {
            heroTitle: 'Book your singing lesson',
            heroSubtitle: 'Leave your availability and the teacher will contact you to confirm your schedule.',
            loginTitle: 'Teacher access',
            loginLabel: 'Password',
            loginBtn: 'Sign in',
            backBtn: 'Back',
            changePassTitle: 'Change password',
            currentPass: 'Current password',
            newPass: 'New password',
            updatePass: 'Update password',
            logout: 'Sign out',
            publicSubmit: 'Send availability',
            tabRequests: 'Requests',
            tabSchedules: 'Schedules',
            tabAssignments: 'Assignments',
            tabNotifications: 'Notifications',
            metricsPending: 'Pending',
            metricsContacted: 'Contacted',
            metricsAssigned: 'Assigned',
            metricsActive: 'Active',
            metricsFree: 'Free slots',
            notifEmpty: 'No notifications',
            notifUnread: 'Unread',
            notifRead: 'Read',
            notifTitle: 'Notifications',
            notifSuccess: 'New request received',
            publicSuccess: 'Availability sent'
        }
    };
    function t(key) { return I18N[currentLang]?.[key] || I18N.es[key] || key; }
    function saveDashboardCache(payload) {
        try {
            sessionStorage.setItem(DASHBOARD_CACHE_KEY, JSON.stringify({
                savedAt: Date.now(),
                metrics: payload.metrics || '',
                students: payload.students || [],
                schedule: payload.schedule || [],
                notifications: payload.notifications || []
            }));
        } catch (e) {}
    }
    function loadDashboardCache() {
        try {
            const raw = sessionStorage.getItem(DASHBOARD_CACHE_KEY);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (!parsed.savedAt || Date.now() - parsed.savedAt > DASHBOARD_CACHE_TTL_MS) return null;
            return parsed;
        } catch (e) {
            return null;
        }
    }
    function setLanguage(lang) {
        currentLang = lang === 'en' ? 'en' : 'es';
        localStorage.setItem('adcl_lang', currentLang);
        document.getElementById('lang-es').classList.toggle('active', currentLang === 'es');
        document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
        document.querySelector('[data-i18n="heroTitle"]').textContent = t('heroTitle');
        document.querySelector('[data-i18n="heroSubtitle"]').textContent = t('heroSubtitle');
        document.querySelector('[data-i18n="loginTitle"]').textContent = t('loginTitle');
        document.querySelector('[data-i18n="loginLabel"]').textContent = t('loginLabel');
        document.querySelector('[data-i18n="loginBtn"]').textContent = t('loginBtn');
        document.querySelector('[data-i18n="backBtn"]').textContent = t('backBtn');
        document.querySelector('[data-i18n="changePassTitle"]').textContent = t('changePassTitle');
        document.querySelector('[data-i18n="currentPass"]').textContent = t('currentPass');
        document.querySelector('[data-i18n="newPass"]').textContent = t('newPass');
        document.querySelector('[data-i18n="updatePass"]').textContent = t('updatePass');
        document.getElementById('logoutBtn').textContent = t('logout');
        document.querySelector('[data-i18n="publicSubmit"]').textContent = t('publicSubmit');
        document.querySelector('[data-i18n="tabRequests"]').textContent = t('tabRequests');
        document.querySelector('[data-i18n="tabSchedules"]').textContent = t('tabSchedules');
        document.querySelector('[data-i18n="tabAssignments"]').textContent = t('tabAssignments');
        document.querySelector('[data-i18n="tabNotifications"]').textContent = t('tabNotifications');
        document.querySelector('[data-i18n="metricsPending"]').textContent = t('metricsPending');
        document.querySelector('[data-i18n="metricsContacted"]').textContent = t('metricsContacted');
        document.querySelector('[data-i18n="metricsAssigned"]').textContent = t('metricsAssigned');
        document.querySelector('[data-i18n="metricsActive"]').textContent = t('metricsActive');
        document.querySelector('[data-i18n="metricsFree"]').textContent = t('metricsFree');
    }

    // Variables globales
    let currentStudents = [];
    let currentSchedule = [];

    // ================= UTILIDADES =================
    function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('logoutBtn').style.display = (id === 'dashboardSection') ? 'block' : 'none';
    }
    function switchDashTab(tabId) {
        document.querySelectorAll('.dash-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    async function api(action, payload = {}) {
        showLoading(true);
        const token = sessionStorage.getItem('admin_token');
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action, payload, token })
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error);
            return data;
        } catch (e) {
            if (e.message.includes('No autorizado') || e.message.includes('Token')) {
                sessionStorage.removeItem('admin_token');
                showSection('loginSection');
                alert('Sesión expirada, inicia sesión nuevamente.');
            } else {
                alert('Error: ' + e.message);
            }
            throw e;
        } finally {
            showLoading(false);
        }
    }

    // ================= PÚBLICO =================
    function submitStudentForm(e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        const days = Array.from(document.querySelectorAll('#daysGroup input:checked')).map(cb => cb.value);
        const times = Array.from(document.querySelectorAll('#timesGroup input:checked')).map(cb => cb.value);
        data.availability = { days, times };
        api('createStudentRequest', data).then((res) => {
            alert(t('publicSuccess'));
            e.target.reset();
            const teacherUrl = res?.data?.teacher_whatsapp_url;
            if (teacherUrl) window.open(teacherUrl, '_blank', 'noopener,noreferrer');
        }).catch(()=>{});
    }

    // ================= LOGIN =================
    async function loginAdmin(e) {
        e.preventDefault();
        const password = document.getElementById('adminPass').value;
        try {
            const res = await api('login', { password });
            sessionStorage.setItem('admin_token', res.data.token);
            document.getElementById('adminPass').value = '';
            showSection('dashboardSection');
            const cached = loadDashboardCache();
            if (cached) {
                if (cached.metrics) document.getElementById('metrics').innerHTML = cached.metrics;
                if (cached.students.length) {
                    currentStudents = cached.students;
                    renderStudentsGrid();
                }
                if (cached.schedule.length) {
                    currentSchedule = cached.schedule;
                    renderCalendar();
                    renderAssignments();
                }
                if (cached.notifications.length) renderNotifications(cached.notifications);
            }
            refreshDashboard();
        } catch (err) { alert('Contraseña incorrecta'); }
    }
    async function changePassword(e) {
        e.preventDefault();
        const currentPassword = document.getElementById('currentPass').value;
        const newPassword = document.getElementById('newPass').value;
        try {
            const res = await api('setAdminPassword', { currentPassword, newPassword });
            alert(res.message || 'Contraseña actualizada');
            document.getElementById('currentPass').value = '';
            document.getElementById('newPass').value = '';
        } catch (err) {}
    }
    async function saveTeacherContact(e) {
        e.preventDefault();
        const currentPassword = document.getElementById('contactPass').value;
        const teacherEmail = document.getElementById('teacherEmail').value;
        const teacherWhatsapp = document.getElementById('teacherWhatsapp').value;
        try {
            const res = await api('setTeacherContact', { currentPassword, teacherEmail, teacherWhatsapp });
            alert(res.message || 'Contactos guardados');
            document.getElementById('contactPass').value = '';
        } catch (err) {}
    }
    function logoutAdmin() { sessionStorage.removeItem('admin_token'); showSection('publicSection'); }
    function volverPublico() { showSection('publicSection'); }
    function handleLogoDoubleClick() {
        if (sessionStorage.getItem('admin_token')) {
            showSection('dashboardSection');
            refreshDashboard();
        } else {
            showSection('loginSection');
        }
    }

    // ================= DASHBOARD =================
    async function refreshDashboard() {
        try {
            const statsPromise = api('getDashboardStats');
            const studentsPromise = api('getStudents');
            const schedulePromise = api('getFullSchedule');
            const notificationsPromise = api('getNotifications', { limit: 20 });

            const stats = await statsPromise;
            const metricsHtml = `
                <div class="metric-card"><span class="metric-val">${stats.data.pending}</span><span class="metric-label">Pendientes</span></div>
                <div class="metric-card"><span class="metric-val">${stats.data.contacted}</span><span class="metric-label">Contactados</span></div>
                <div class="metric-card"><span class="metric-val">${stats.data.assigned}</span><span class="metric-label">Asignados</span></div>
                <div class="metric-card"><span class="metric-val">${stats.data.active}</span><span class="metric-label">Activos</span></div>
                <div class="metric-card"><span class="metric-val">${stats.data.free_slots}</span><span class="metric-label">Cupos libres</span></div>
            `;
            document.getElementById('metrics').innerHTML = metricsHtml;
            saveDashboardCache({ metrics: metricsHtml });

            const studentsRes = await studentsPromise;
            currentStudents = studentsRes.data;
            renderStudentsGrid();
            saveDashboardCache({ metrics: metricsHtml, students: currentStudents, schedule: currentSchedule, notifications: [] });

            requestAnimationFrame(async () => {
                try {
                    const [scheduleRes, notificationsRes] = await Promise.all([schedulePromise, notificationsPromise]);
                    currentSchedule = scheduleRes.data;
                    renderCalendar();
                    renderAssignments();
                    renderNotifications(notificationsRes.data || []);
                    saveDashboardCache({
                        metrics: metricsHtml,
                        students: currentStudents,
                        schedule: currentSchedule,
                        notifications: notificationsRes.data || []
                    });
                } catch (innerErr) {}
            });
        } catch(e) {}
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function normalizeWhatsapp(raw) {
        const digits = String(raw || '').replace(/\D/g, '');
        if (digits.length === 10) return `52${digits}`;
        if (digits.length === 12 && digits.startsWith('52')) return digits;
        if (digits.length === 13 && digits.startsWith('521')) return `52${digits.slice(3)}`;
        return digits;
    }

    function buildWhatsappUrl(phone, message) {
        const normalized = normalizeWhatsapp(phone);
        if (!normalized || normalized.length < 12) return null;
        return `https://wa.me/${normalized}?text=${encodeURIComponent(message)}`;
    }

    function toggleWhatsappMenu(studentId) {
        const menu = document.getElementById(`whatsapp-menu-${studentId}`);
        if (menu) menu.classList.toggle('open');
    }

    function getStudentById(studentId) {
        return currentStudents.find(s => s.id === studentId) || null;
    }

    function getAvailability(student) {
        if (!student) return { days: [], times: [], assigned_time: '' };
        try {
            if (typeof student.availability_json === 'string') return JSON.parse(student.availability_json) || {};
            return student.availability_json || {};
        } catch (e) {
            return {};
        }
    }

    function pickFromArray(items, fallback) {
        return Array.isArray(items) && items.length > 0 ? items[0] : fallback;
    }

    function buildWhatsappMessage(type, name, student, avail) {
        const day = pickFromArray(avail.days, 'No especificado');
        const time = avail.assigned_time || pickFromArray(avail.times, 'No especificado');
        const modality = student?.mode || student?.session_mode || 'clase de canto';
        const options = Array.isArray(avail.times) && avail.times.length > 0
            ? avail.times.slice(0, 3)
            : ['Opción 1', 'Opción 2', 'Opción 3'];

        switch (type) {
            case 'confirm_schedule':
                return `Hola ${name}, soy tu maestra de Arte del Cantar.\n\nVi tu registro y tengo disponible este horario para tu clase de canto:\n\n📅 Día: ${day}\n🕒 Hora: ${time}\n🎵 Modalidad: ${modality}\n\n¿Me confirmas si te queda bien?`;
            case 'send_options':
                return `Hola ${name}, soy tu maestra de Arte del Cantar.\n\nVi tu disponibilidad y te puedo ofrecer estas opciones:\n\n1) ${options[0]}\n2) ${options[1] || 'Opción 2'}\n3) ${options[2] || 'Opción 3'}\n\n¿Cuál te queda mejor?`;
            case 'request_more':
                return `Hola ${name}, soy tu maestra de Arte del Cantar.\n\nGracias por registrarte. Vi tu disponibilidad, pero necesito que me compartas un poco más de opciones para poder acomodarte mejor.\n\n¿Me podrías decir qué otros días u horarios tienes disponibles?`;
            case 'first_class':
                return `Hola ${name}, perfecto.\n\nTe confirmo tu primera clase de canto:\n\n📅 Día: ${day}\n🕒 Hora: ${time}\n🎵 Modalidad: ${modality}\n\nPor favor llega unos minutos antes o conéctate puntual.\n\nNos vemos en clase.`;
            case 'reminder':
                return `Hola ${name}, te recuerdo tu clase de canto de hoy:\n\n🕒 Hora: ${time}\n🎵 Modalidad: ${modality}\n\nNos vemos pronto.`;
            case 'reschedule':
                return `Hola ${name}, necesito mover tu clase de canto.\n\n¿Me puedes confirmar qué horario te queda mejor para reagendar?\n\nOpciones disponibles:\n1) ${options[0]}\n2) ${options[1] || 'Opción 2'}\n3) ${options[2] || 'Opción 3'}`;
            case 'follow_up':
                return `Hola ${name}, solo paso a dar seguimiento a tu registro para clases de canto.\n\n¿Sigues interesado/a en tomar clase?`;
            case 'gentle_reject':
                return `Hola ${name}, gracias por tu interés en las clases de canto.\n\nPor ahora no pude confirmar tu horario, pero si más adelante se abre un espacio, con gusto te aviso.`;
            default:
                return '';
        }
    }

    async function whatsappAction(studentId, rawPhone, name, type) {
        const student = getStudentById(studentId);
        if (!student) return alert('Alumno no encontrado');

        const avail = getAvailability(student);
        const message = buildWhatsappMessage(type, name, student, avail);
        const url = buildWhatsappUrl(rawPhone, message);

        if (!url) {
            alert('El número de WhatsApp no tiene un formato válido.');
            return;
        }

        const statusMap = {
            confirm_schedule: 'contactado',
            send_options: 'contactado',
            request_more: 'contactado',
            first_class: 'asignado',
            reminder: 'activo',
            reschedule: 'contactado',
            follow_up: 'contactado',
            gentle_reject: 'descartado'
        };

        try {
            await api('updateStudent', {
                id: studentId,
                updates: {
                    status: statusMap[type] || student.status,
                    updated_at: new Date().toISOString()
                }
            });
            window.open(url, '_blank', 'noopener,noreferrer');
            refreshDashboard();
        } catch (e) {}
    }

    function renderStudentsGrid() {
        const grid = document.getElementById('studentsGrid');
        grid.innerHTML = currentStudents.map(s => {
            let avail = { days: [], times: [] };
            try { avail = s.availability_json || {}; } catch(e) {}
            const days = avail.days?.join(', ') || 'No especificado';
            const times = avail.times?.join(', ') || 'No especificado';
            return `
            <div class="student-card">
                <div><strong>${escapeHtml(s.full_name)}</strong> <span class="badge status-${escapeHtml(s.status)}">${escapeHtml(s.status)}</span></div>
                <div class="student-phone">${escapeHtml(s.whatsapp)}</div>
                <div class="student-tags"><span class="badge">${escapeHtml(s.vocal_level || 'N/A')}</span> <span class="badge">${escapeHtml(s.commitment || '')}</span></div>
                <div class="student-availability">📅 ${escapeHtml(days)}<br>⏰ ${escapeHtml(times)}<br><i>${escapeHtml(s.goal || '')}</i></div>
                <div class="student-actions">
                    <button class="btn-action btn-confirm" onclick="confirmStudent('${escapeHtml(s.id)}', '${escapeHtml(s.whatsapp)}', '${escapeHtml(s.full_name)}')">✅ Confirmar horario</button>
                    <div class="student-action-row">
                        <button class="btn-action whatsapp-toggle" onclick="toggleWhatsappMenu('${escapeHtml(s.id)}')">WhatsApp ▼</button>
                        <button class="btn-action btn-danger" onclick="deleteStudent('${escapeHtml(s.id)}')">🗑️ Eliminar</button>
                        <button class="btn-action btn-outline" onclick="addNote('${escapeHtml(s.id)}', '${escapeHtml(s.internal_note || '')}')">📝 Nota</button>
                    </div>
                    <div class="whatsapp-menu" id="whatsapp-menu-${escapeHtml(s.id)}">
                        <button class="btn-action btn-outline" onclick="whatsappAction('${escapeHtml(s.id)}', '${escapeHtml(s.whatsapp)}', '${escapeHtml(s.full_name)}', 'send_options')">Enviar opciones</button>
                        <button class="btn-action btn-outline" onclick="whatsappAction('${escapeHtml(s.id)}', '${escapeHtml(s.whatsapp)}', '${escapeHtml(s.full_name)}', 'request_more')">Pedir más disponibilidad</button>
                        <button class="btn-action btn-outline" onclick="whatsappAction('${escapeHtml(s.id)}', '${escapeHtml(s.whatsapp)}', '${escapeHtml(s.full_name)}', 'first_class')">Confirmar primera clase</button>
                        <button class="btn-action btn-outline" onclick="whatsappAction('${escapeHtml(s.id)}', '${escapeHtml(s.whatsapp)}', '${escapeHtml(s.full_name)}', 'reminder')">Recordatorio</button>
                        <button class="btn-action btn-outline" onclick="whatsappAction('${escapeHtml(s.id)}', '${escapeHtml(s.whatsapp)}', '${escapeHtml(s.full_name)}', 'reschedule')">Reagendar</button>
                        <button class="btn-action btn-outline" onclick="whatsappAction('${escapeHtml(s.id)}', '${escapeHtml(s.whatsapp)}', '${escapeHtml(s.full_name)}', 'follow_up')">Seguimiento</button>
                        <button class="btn-action btn-outline" onclick="whatsappAction('${escapeHtml(s.id)}', '${escapeHtml(s.whatsapp)}', '${escapeHtml(s.full_name)}', 'gentle_reject')">Descartar amable</button>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function removeStudentFromView(id) {
        currentStudents = currentStudents.filter(s => s.id !== id);
        renderStudentsGrid();
    }

    async function confirmStudent(id, phone, name) {
        const student = getStudentById(id);
        const avail = getAvailability(student);
        const days = Array.isArray(avail.days) ? avail.days : [];
        const times = Array.isArray(avail.times) ? avail.times : [];
        const combos = [];
        days.forEach(day => times.forEach(time => combos.push({ day, time })));

        if (combos.length === 0) {
            alert('Este alumno no tiene horarios suficientes en su formulario.');
            return;
        }

        const modal = document.getElementById('sessionModal');
        const listDiv = document.getElementById('sessionList');
        listDiv.innerHTML = combos.map((slot, index) => `
            <div style="padding:1rem; margin:0.5rem 0; background: var(--bg); border-radius:8px; cursor:pointer;" onclick="selectSession('${escapeHtml(id)}', '${escapeHtml(slot.day)}', '${escapeHtml(slot.time)}', '${escapeHtml(phone)}', '${escapeHtml(name)}', '${index}')">
                <strong>${escapeHtml(slot.day)} · ${escapeHtml(slot.time)}</strong><br>
                Disponible desde el formulario
            </div>
        `).join('');
        modal.style.display = 'flex';
    }

    window.selectSession = async function(studentId, day, time, phone, name) {
        closeModal();
        try {
            const student = getStudentById(studentId);
            const avail = getAvailability(student);
            avail.assigned_time = `${day} ${time}`;
            await api('updateStudent', {
                id: studentId,
                updates: {
                    status: 'asignado',
                    availability_json: JSON.stringify(avail),
                    updated_at: new Date().toISOString()
                }
            });
            await refreshDashboard();
            // Abrir WhatsApp
            const message = `Hola ${name}, tu clase ha sido asignada para ${day} ${time}. Revisa tu horario en el sistema.`;
            const normalized = normalizeWhatsapp(phone);
            window.open(`https://wa.me/${normalized}?text=${encodeURIComponent(message)}`, '_blank', 'noopener,noreferrer');
        } catch(e) { alert('Error al asignar: ' + e.message); }
    };

    function closeModal() { document.getElementById('sessionModal').style.display = 'none'; }

    async function deleteStudent(id) {
        if (confirm('¿Eliminar este alumno? (Se conservará oculto)')) {
            removeStudentFromView(id);
            api('deleteStudent', { id })
                .then(() => refreshDashboard())
                .catch(() => refreshDashboard());
        }
    }
    async function addNote(id, currentNote) {
        const note = prompt('Nota interna:', currentNote);
        if (note !== null) {
            await api('updateStudent', { id, updates: { internal_note: note } });
            const student = currentStudents.find(s => s.id === id);
            if (student) student.internal_note = note;
            renderStudentsGrid();
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const daysOfWeek = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
        let html = '';
        daysOfWeek.forEach(day => {
            const daySessions = currentSchedule.filter(s => s.day === day);
            html += `<div class="calendar-day"><div class="calendar-day-header">${day}</div>`;
            if (daySessions.length === 0) html += '<div style="text-align:center; color:gray;">Sin sesiones</div>';
            daySessions.forEach(session => {
                html += `<div class="session-card">
                    <div class="session-time">${escapeHtml(session.start_time)} - ${escapeHtml(session.end_time)}</div>
                    <div class="session-mode">${escapeHtml(session.mode)} · Cupo: ${escapeHtml(session.current_students)}/${escapeHtml(session.max_students)}</div>
                    ${session.students.map(st => {
                        const phone = normalizeWhatsapp(st.whatsapp);
                        const wa = phone ? `https://wa.me/${phone}` : '#';
                        return `<div>🎤 ${escapeHtml(st.full_name)} <a href="${wa}" target="_blank" rel="noopener noreferrer">📱</a></div>`;
                    }).join('')}
                </div>`;
            });
            html += `</div>`;
        });
        grid.innerHTML = html;
    }

    function renderAssignments() {
        const grid = document.getElementById('assignmentsGrid');
        if (!grid) return;
        const assigned = currentSchedule.filter(s => Array.isArray(s.students) && s.students.length > 0);
        if (assigned.length === 0) {
            grid.innerHTML = '<div style="text-align:center; color:gray; padding:2rem;">Sin asignaciones todavía</div>';
            return;
        }
        grid.innerHTML = assigned.map(session => `
            <div class="session-card">
                <div class="session-time">${escapeHtml(session.day)} ${escapeHtml(session.start_time)} - ${escapeHtml(session.end_time)}</div>
                <div class="session-mode">${escapeHtml(session.mode)} · Cupo: ${escapeHtml(session.current_students)}/${escapeHtml(session.max_students)}</div>
                ${session.students.map(st => `
                    <div style="margin-top:0.5rem;">
                        <strong>${escapeHtml(st.full_name)}</strong>
                        <a href="https://wa.me/${normalizeWhatsapp(st.whatsapp)}?text=${encodeURIComponent('Hola, soy tu maestra de Arte del Cantar. Vi tu disponibilidad y quiero confirmar tu horario para clase.')}" target="_blank" rel="noopener noreferrer"> WhatsApp</a>
                    </div>
                `).join('')}
            </div>
        `).join('');
    }

    function renderNotifications(items) {
        const grid = document.getElementById('notificationsList');
        if (!grid) return;
        if (!items.length) {
            grid.innerHTML = `<div style="text-align:center; color:gray; padding:2rem;">${t('notifEmpty')}</div>`;
            return;
        }
        grid.innerHTML = items.map(n => `
            <div class="notification-item ${n.is_read ? '' : 'unread'}">
                <div style="display:flex; justify-content:space-between; gap:1rem; align-items:flex-start;">
                    <div>
                        <div style="font-weight:600; margin-bottom:0.35rem;">${escapeHtml(n.title)}</div>
                        <div style="color:var(--text-muted); font-size:0.9rem;">${escapeHtml(n.message)}</div>
                    </div>
                    <button class="btn-outline" style="padding:0.35rem 0.7rem; white-space:nowrap;" onclick="markNotificationRead('${escapeHtml(n.id)}')">${n.is_read ? t('notifRead') : t('notifUnread')}</button>
                </div>
            </div>
        `).join('');
    }

    async function markNotificationRead(id) {
        await api('markNotificationRead', { id });
        refreshDashboard();
    }

    // Inicializar checkboxes del formulario público
    function initPublicForm() {
        const daysDiv = document.getElementById('daysGroup');
        const timesDiv = document.getElementById('timesGroup');
        const dias = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
        const horas = ['Mañana (9am-1pm)','Tarde (2pm-6pm)','Noche (6pm-9pm)'];
        daysDiv.innerHTML = dias.map(d => `<label class="checkbox-label"><input type="checkbox" value="${d}"> ${d}</label>`).join('');
        timesDiv.innerHTML = horas.map(h => `<label class="checkbox-label"><input type="checkbox" value="${h}"> ${h}</label>`).join('');
    }
    initPublicForm();
    setLanguage(currentLang);
    if (API_URL === '{{SCRIPT_URL}}') console.warn('⚠️ Configura la variable API_URL con la URL de tu Web App');
</script>
